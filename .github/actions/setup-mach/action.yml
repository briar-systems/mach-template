name: setup mach
description: install a published mach compiler for this runner, verified against the release's SHA256SUMS

inputs:
  version:
    description: release tag to install, empty for the pin in .github/mach-version, or latest
    required: false
    default: ""
  token:
    description: token used to read the release
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: the installed release tag
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)   host=x86_64-linux;   ext=tar.gz ;;
          Linux/ARM64) host=aarch64-linux;  ext=tar.gz ;;
          macOS/X64)   host=x86_64-darwin;  ext=tar.gz ;;
          macOS/ARM64) host=aarch64-darwin; ext=tar.gz ;;
          Windows/X64) host=x86_64-windows; ext=zip ;;
          *) echo "::error::no published mach build for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        if [ -z "$VERSION" ]; then VERSION=$(tr -d '[:space:]' < .github/mach-version); fi
        if [ "$VERSION" = latest ]; then
          VERSION=$(gh release view -R briar-systems/mach --json tagName --jq .tagName)
        fi
        asset="mach-${VERSION#v}-$host.$ext"
        dir="$RUNNER_TEMP/mach-$VERSION"
        mkdir -p "$dir"
        gh release download "$VERSION" -R briar-systems/mach -p "$asset" -p SHA256SUMS -D "$dir" --clobber
        # verify before extracting anything
        if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
        (cd "$dir" && awk -v a="$asset" '$2 == a || $2 == "*" a' SHA256SUMS | $sum -c -)
        case "$ext" in
          zip) pwsh -NoProfile -Command "Expand-Archive -Force -Path '$dir/$asset' -DestinationPath '$dir'" ;;
          *)   tar -xzf "$dir/$asset" -C "$dir" && chmod +x "$dir/mach" ;;
        esac
        echo "$dir" >> "$GITHUB_PATH"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "installed mach $VERSION for $host"
