name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      profile:
        type: string
        default: debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_VERSION: 6.8.0
  PROFILE: ${{ inputs.profile || 'debug' }}

jobs:
  # one runner per host os and isa the manifest declares a target for
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hosts: ${{ steps.plan.outputs.hosts }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        shell: python
        run: |
          import json, os, tomllib

          # a target with no runner here is built, never tested
          runners = {
              ("linux", "x86_64"): "ubuntu-latest",
              ("linux", "aarch64"): "ubuntu-24.04-arm",
              ("windows", "x86_64"): "windows-latest",
              ("darwin", "aarch64"): "macos-15",
              ("darwin", "x86_64"): "macos-15-intel",
          }
          hosts = {}
          for name, t in tomllib.load(open("mach.toml", "rb")).get("target", {}).items():
              runner = runners.get((t["os"], t["isa"]))
              print(f"{name}: {runner or 'build only'}")
              if runner:
                  hosts.setdefault(runner, []).append(f"-t {name}")
          if not hosts:
              raise SystemExit("no target in mach.toml has a native runner")
          matrix = [{"runs-on": r, "targets": " ".join(t)} for r, t in hosts.items()]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"hosts={json.dumps(matrix)}\n")

  test:
    needs: plan
    name: test (${{ matrix.host.runs-on }})
    runs-on: ${{ matrix.host.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.hosts) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: install mach
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/mach"
          url="https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "irm $url/install.ps1 | iex"
          else
            curl -fsSL "$url/install.sh" | sh
          fi
          echo "$MACH_INSTALL_DIR" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - run: mach test . --all -p "$PROFILE" ${{ matrix.host.targets }}

  # every target, including the ones no runner can execute
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: install mach
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/mach"
          curl -fsSL "https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist/install.sh" | sh
          echo "$MACH_INSTALL_DIR" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - run: mach fmt --check .
      - run: mach build . --all -p "$PROFILE"

  gate:
    if: always()
    needs: [plan, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
